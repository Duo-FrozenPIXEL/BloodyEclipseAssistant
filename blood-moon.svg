<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blutroter Mond ueber dunklem Nachthimmel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010a"/>
      <stop offset="0.6" stop-color="#14040c"/>
      <stop offset="1" stop-color="#2a0510"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.38" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ff6a4d"/>
      <stop offset="0.45" stop-color="#c4161c"/>
      <stop offset="1" stop-color="#5a0508"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#b30d12" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b30d12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="600" cy="230" r="125"/></clipPath>
  </defs>

  <rect width="1200" height="520" fill="url(#sky)"/>

  <!-- Sterne -->
  <g fill="#ffe9e0">
    <circle cx="90" cy="70" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="140" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="50" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="170" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="60" r="1.7"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="150" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="90" r="1.9"><animate attributeName="opacity" values="1;0.4;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="190" r="1.1"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="260" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="280" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="40" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="45" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Glow -->
  <circle cx="600" cy="230" r="300" fill="url(#glow)">
    <animate attributeName="r" values="280;320;280" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Mond -->
  <circle cx="600" cy="230" r="125" fill="url(#moon)"/>
  <g clip-path="url(#disc)" fill="#7a0a0e" opacity="0.55">
    <circle cx="560" cy="190" r="26"/>
    <circle cx="640" cy="170" r="14"/>
    <circle cx="625" cy="265" r="32"/>
    <circle cx="545" cy="275" r="12"/>
    <circle cx="672" cy="225" r="9"/>
    <circle cx="590" cy="130" r="10"/>
  </g>
  <circle cx="600" cy="230" r="125" fill="url(#shade)" opacity="0.7"/>
  <circle cx="600" cy="230" r="125" fill="none" stroke="#ff5a3c" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Horizont -->
  <path d="M0 520 L0 430 L90 400 L170 425 L260 380 L350 420 L450 395 L560 430 L660 400 L760 428 L860 385 L960 420 L1060 392 L1140 418 L1200 400 L1200 520 Z" fill="#050106"/>

  <!-- Titel -->
  <text x="600" y="455" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#ff4a3d" letter-spacing="6">BLOODY ECLIPSE</text>
  <text x="600" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#e8b4ab" letter-spacing="10">A S S I S T A N T</text>
</svg>
